<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body >

    <div class="container">
        <div class="loginin-box">

        <h2>Login</h2>

        <div class="input-box">
           ✉️ <input type="email"
            placeholder="Enter Your Email">
        </div>
         <div class="input-box">
           🔒 <input type="password"
            placeholder="Enter Your Password">
         </div>

         <div class="options">
            
            <label for="">

                <input type="checkbox">Remember Me
            </label>

            <a href="#"> Forgot Password</a>
         </div>

         <button>Login Now</button>

         <div class="signup">
            Don't have a account?
            <a href="#">Signup Now</a>
         </div>
     </div>


     <div class="registration-details">
         
        <h2>Registration</h2>

        <div class="input">
           👤 <input type="text"
            placeholder="Enter Your Name">
        </div>

        <div class="input">
          ✉️  <input type="email"
            placeholder="Enter Your Email">
        </div>

        <div class="input">
           🔒 <input type="password"
            placeholder="Create a Password">

        </div>

        <div class="input">
            🔒<input type="text"
            placeholder="Confirm a Password">
        </div>

        <div class="option-s">
            <label for="">
                <input type="checkbox">I accept all terms and conditons
            </label>
        </div>
        <br>

        <button>Register Now</button>
        <div class="sign-up">
            Don't have a account?
            
            <a href="#">Signup Now</a>
         </div>



     </div> 
    </div>
     
</body>
</html>
