<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Forms</title>
  </head>
  <body>
    <fieldset>
        <legend align="center">Basic Form</legend>
        <form>
      <label for="fullName">Full Name :</label>
      <input
        type=" text"
        name="yourName"
        id="fullName"
        placeholder="Enter your name"
      />

      <br />
      <br />
      <label for="email">Email :</label>
      <input
        type="text"
        name="email"
        id="email"
        placeholder=" Enter your email"
      />
      <br />
      <br />

      <label for="password">Password :</label>
      <input
        type="Password"
        name="newPassword"
        id="Password"
        placeholder="Enter your password"
      />
      <br />
      <br />
      <label for="cfpassword"> Confirm Passsword :</label>
      <input
        type="Password"
        name="cofirmpassword"
        id="cfpassword"
        placeholder="Confirm your password"
      />
      <br />
      <br />
      <label for="dob">Date Of Birth :</label>
      <input type="date" name="dob" id="dob" />
      <br />
      <br />

      <label for="time">Time :</label>
      <input type="time" name="time" id="time" />
      <br />
      <br />

      <label for="JoiningTime">Jaoining Time</label>
      <input type="datetime-local" name="JoiningTime" id="JoiningTime" />
      <br />
      <br />
      <label for="volume">Volume :</label>
      <input
        type="range"
        name="volume"
        id="volume"
        min="0"
        max="10"
        value="3"
      />
      <br />
      <br />
      <label for="mobile">Mobile :</label>
      <input
        type="number"
        name="mobile"
        id="mobile"
        placeholder="Enter Your Number"
      />
      <br />
      <br />
      <label for="resume">Resume :</label>
      <input type="file" name="resume" id="resume" />
      <br />
      <br />
      <label for="address">Address :</label>
      <textarea name="address" id="address"></textarea>
      <br />
      <br />
      <label for="course">Course :</label>
      <select name="course" id="course">
        <option value="">--Select Couse--</option>
        <option value="Btech">Btech</option>
        <option value="bba">BBA</option>
        <option value="mba">MBA</option>
        <option value="mtech">MTECH</option>
      </select>
      <br>
      <br>
      <label for="gender">Gender :</label>
      <input type="radio" name="gender" id="male value=male"><span>male</span>
      <input type="radio" name="gender" id="female value=female"><span>female</span>
      <input type="radio" name="gender" id="other value=other"><span>others</span>

      <br>
      <br>

      <label for="Skillset">Skill set :</label>
      <input type="checkbox" name="skillset" id="java" value="java"><span>java</span>
      <input type="checkbox" name="skillset" id="dsa" value="dsa"><span>dsa</span>
      <input type="checkbox" name="skillset" id="html" value="html"><span>html</span>
       <input type="checkbox" name="skillset" id="none" value="none"><span>none</span>
      <br>

<img src="Screenshot 2026-09-14 235617.png" alt=""
height="150"
width="400">

      <button>submit</button>
    </form>
    </fieldset>
  </body>
</html>
